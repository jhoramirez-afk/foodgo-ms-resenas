services:
  mysql:
    image: mysql:8.4
    container_name: foodgo-resenas-mysql
    environment:
      MYSQL_DATABASE: foodgo_resenas
      MYSQL_USER: foodgo
      MYSQL_PASSWORD: foodgo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DB_EXPOSE_PORT:-33068}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: foodgo-resenas-svc
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: foodgo_resenas
      DB_USER: foodgo
      DB_PASSWORD: foodgo
      PORT: 8088
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PORT:-8088}:8088"

volumes:
  mysql_data:
